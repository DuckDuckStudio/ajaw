name: 发布到 PyPI

# 发布了非预发行的新版本时
on:
  release:
    types: [released]

permissions: {}

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: 签出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 设置 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: 安装 uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: 构建
        shell: bash
        run: uv build --no-sources

      - name: 功能测试 (wheel)
        shell: bash
        run: uv run --isolated --no-project --with dist/*.whl --with "pytest~=9.1.1" pytest -o "addopts=" "tests/test_function.py"

      - name: 功能测试 (源码分发)
        shell: bash
        run: uv run --isolated --no-project --with dist/*.tar.gz --with "pytest~=9.1.1" pytest -o "addopts=" "tests/test_function.py"

      - name: 上传分发文件为工件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: 发布
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi
    steps:
      - name: 安装 uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: 下载分发工件
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: 生成 PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: 发布
        shell: bash
        run: uv publish --publish-url "https://upload.pypi.org/legacy/" --check-url "https://pypi.org/simple"

name: Python 代码检查

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  lint:
    name: 运行 lint 检查
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: 安装 uv (Linux 和 macOS)
        shell: bash
        if: ${{ runner.os != 'Windows' }}
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 安装 uv (Windows)
        shell: pwsh
        if: ${{ runner.os == 'Windows' }}
        run: powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"

      - name: 安装依赖
        shell: bash
        run: uv sync

      - name: (isort) 检查导入格式
        shell: bash
        run: |-
          uv run isort "." --skip ".venv"

      - name: (ruff) 检查格式
        shell: bash
        run: uv run ruff format --check

      - name: (ruff) 检查错误
        shell: bash
        run: uv run ruff check

      - name: (ty) 检查错误
        shell: bash
        run: uv run ty check

      - name: (pylint) 检查错误
        shell: bash
        run: |-
          uv run pylint "." --ignore ".venv"

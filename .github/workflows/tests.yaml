name: Pytest

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  run-pytest:
    name: 运行 Pytest 测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version:
          - 3.10.x
          - 3.11.x
          - 3.12.x
          - 3.13.x
          - 3.14.x
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: 安装依赖
        shell: bash
        run: uv sync

      - name: 运行测试
        shell: bash
        run: uv run pytest -vv --deselect tests/test_mo.py::test_bundled_mo_matches_upstream_main

      - name: 检查附带的翻译文件
        # 仅在最新的支持的 Python 版本、Ubuntu 系统中，运行一次
        # https://github.com/DuckDuckStudio/ajaw/issues/6
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14.x' }}
        shell: bash
        run: uv run pytest -vv tests/test_mo.py::test_bundled_mo_matches_upstream_main
